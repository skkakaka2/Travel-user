server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: travel-user
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

zy:
  mybatis:
    pagination-max-limit: 500
    pagination-overflow: false
  documentation:
    group-id: default
    group-display-name: Travel User API
    description: 家庭自驾游规划用户服务生产环境接口
    version: 1.0.0
  security:
    jwt:
      secret: ${ZY_SECURITY_JWT_SECRET}
      issuer: travel-user
      expiration: PT2H

feign:
  sentinel:
    enabled: false
